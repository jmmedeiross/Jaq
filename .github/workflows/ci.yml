name: Testes do Jaq

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/jaq-alongamentos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: API, permissões, concorrência e recuperação
        run: python tests/run.py --browser
      - name: HTTPS, domínio, cookies e proxy confiável
        run: python tests/remote-hosting.py
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaq-test-results
          path: projects/jaq-alongamentos/work/test-results/
          if-no-files-found: ignore
          retention-days: 7
